<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VUS IDE · 排版设计器</title>
<!-- 首帧前应用主题，避免刷新时的文字/背景闪烁（FOUC） -->
<script>
  (function () {
    try {
      var t = ((typeof localStorage !== 'undefined') && localStorage.getItem('vusTheme')) || 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.classList.add('themed');
    } catch (e) { document.documentElement.classList.add('themed'); }
    var h = (typeof window !== 'undefined' && window.location.hash) || '';
    document.documentElement.setAttribute('data-route', h.replace(/^#\/?/, '') || 'designer');
  })();
</script>
<link rel="stylesheet" href="libs/cm/codemirror.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>

  <!-- 本地 vendored 前端依赖（无 CDN） -->
  <script src="libs/vue.global.js"></script>
  <script src="libs/cm/codemirror.min.js"></script>
  <!-- 应用模块（普通脚本，顺序加载，共享全局 window.VUS） -->
  <script src="app/controls_schema.js"></script>
  <script src="app/vusBuiltins.js"></script>
  <script src="app/store.js"></script>
  <script src="app/designer.js"></script>
  <script src="app/editor.js"></script>
  <script src="app/search.js"></script>
  <script src="app/plugins.js"></script>
  <script src="app/settings.js"></script>
  <script src="app/main.js"></script>
</body>
</html>
